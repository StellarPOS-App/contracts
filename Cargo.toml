[workspace]
resolver = "2"
members = [
    "contracts/shared",
    "contracts/merchant-registry",
    "contracts/payment-processor",
    "contracts/loyalty-program",
    "contracts/treasury",
    "contracts/escrow-service",
    "contracts/payment-stream",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/StellarPOS-App/contracts"
rust-version = "1.84"

[workspace.dependencies]
soroban-sdk = "27.0.6"
shared = { path = "contracts/shared" }
merchant-registry = { path = "contracts/merchant-registry" }
loyalty-program = { path = "contracts/loyalty-program" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
