name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Compile every contract
        run: cargo check --workspace --lib
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  protocol-compatibility:
    name: protocol ${{ matrix.protocol }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        protocol: [25, 26, 27]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Exercise merchant lifecycle on protocol ${{ matrix.protocol }}
        env:
          STELLARPOS_PROTOCOL_VERSION: ${{ matrix.protocol }}
        run: cargo test -p merchant-registry --test protocol_compatibility

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  gas-benchmarks:
    name: gas benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Benchmark escrow creation against CPU and memory limits
        run: cargo test -p escrow-service gas_benchmarks -- --nocapture

  wasm:
    name: build wasm
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --target wasm32v1-none --release
      - name: Report sizes
        run: ls -l target/wasm32v1-none/release/*.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: contracts-wasm
          path: target/wasm32v1-none/release/*.wasm
